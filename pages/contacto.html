<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contacto - Cooperativa Tecnológica Martín Fierro" />
    <title>Contacto | Cooperativa Tecnológica Martín Fierro</title>
    <!-- Bootstrap CSS v5.3.3 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-..."
      crossorigin="anonymous"
    />
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="icon" href="../assets/img/icons/destornillador_color.PNG" type="image/png" />
  </head>
  <body>
    <!-- Header / Navbar -->
    <header class="barra_sup fixed-top">
      <div class="logo_barra">
        <a href="../index.html">
          <img src="../assets/img/icons/destornillador_byn.PNG" alt="Logo Cooperativa" class="logo-nav" />
        </a>
      </div>
      <nav class="menu_barra">
        <ul>
          <li><a href="../index.html" class="enlace-nav">Inicio</a></li>
          <li><a href="situacion.html" class="enlace-nav">La situación en la que estamos</a></li>
          <li><a href="serv-tec.html" class="enlace-nav">Servicio técnico</a></li>
          <li><a href="desarrollo.html" class="enlace-nav">Desarrollo de software</a></li>
          <li><a href="contact.html" class="enlace-nav activo">Contacto</a></li>
        </ul>
      </nav>
    </header>
    <!-- Spacer para header fixed -->
    <div style="height: 80px"></div>

    <!-- Main Content -->
    <main class="container my-5">
      <h2 class="text-primary mb-4 text-center">Contáctanos</h2>
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <form action="#" method="post">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="tu@correo.com" required />
            </div>
            <div class="mb-3">
              <label for="asunto" class="form-label">Asunto</label>
              <input type="text" class="form-control" id="asunto" name="asunto" placeholder="Asunto del mensaje" required />
            </div>
            <div class="mb-3">
              <label for="mensaje" class="form-label">Mensaje</label>
              <textarea class="form-control" id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary px-4">Enviar mensaje</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer id="footer">
      <div class="general text-center mb-3">
        <h2 class="footer-titulo">¡Contáctanos!</h2>
        <p class="footer-subtitulo">Nuestras redes sociales</p>
      </div>
      <div class="icono-footer text-center mb-3">
        <a href="#" class="social-link me-3">
          <img src="../assets/img/icons/fi-brands-github.svg" alt="GitHub" class="social-icono" />
        </a>
        <a href="#" class="social-link me-3">
          <img src="../assets/img/icons/fi-brands-facebook.svg" alt="Facebook" class="social-icono" />
        </a>
        <a href="#" class="social-link me-3">
          <img src="../assets/img/icons/fi-brands-youtube.svg" alt="YouTube" class="social-icono" />
        </a>
        <a href="#" class="social-link">
          <img src="../assets/img/icons/fi-brands-instagram.svg" alt="Instagram" class="social-icono" />
        </a>
      </div>
      <div class="footer-creditos text-center mb-2">
        <p>Cooperativa Tecnológica Martín Fierro</p>
      </div>
    </footer>

    <!-- Bootstrap JS Bundle v5.3.3 -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-..."
      crossorigin="anonymous"
    ></script>
  </body>
</html>
